<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Photo Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --panel: #f5f8fb;
      --border: #d8e2eb;
      --blue: #79c8ff;
      --text: #1f2d3d;
      --muted: #64748b;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    #app {
      display: grid;
      grid-template-columns: minmax(520px, 42vw) 1fr;
      height: 100vh;
      width: 100vw;
    }

    aside {
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-width: 0;
      overflow: hidden;
    }

    .header {
      padding: 18px 20px 12px;
      border-bottom: 1px solid var(--border);
      background: #ffffff;
    }

    .header h1 {
      margin: 0 0 6px;
      font-size: 20px;
      line-height: 1.2;
    }

    .header p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }

    .viewer {
      min-height: 0;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .image-stage {
      flex: 1;
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eaf1f7;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
    }

    .image-stage img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .placeholder {
      max-width: 340px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .caption {
      min-height: 48px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
    }

    .caption strong {
      color: var(--text);
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .gallery {
      height: 178px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 14px 18px 18px;
      background: #fff;
      border-top: 1px solid var(--border);
    }

    .thumb {
      flex: 0 0 auto;
      height: 138px;
      width: 190px;
      object-fit: cover;
      border-radius: 12px;
      border: 3px solid transparent;
      cursor: pointer;
      background: #eef2f6;
    }

    .thumb.active {
      border-color: var(--blue);
    }

    #map {
      width: 100%;
      height: 100%;
      background: #dbe6ef;
    }

    .map-toolbar {
      position: absolute;
      z-index: 900;
      top: 14px;
      right: 14px;
      display: flex;
      gap: 8px;
      padding: 6px;
      border-radius: 14px;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 6px 20px rgba(0,0,0,0.16);
    }

    .map-toolbar button {
      border: 1px solid #cfd8e3;
      background: #fff;
      color: #213144;
      padding: 8px 11px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
    }

    .map-toolbar button.active {
      background: #e5f4ff;
      border-color: var(--blue);
    }

    .photo-callout {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.96);
      border: 2px solid var(--blue);
      border-radius: 7px;
      padding: 5px 8px;
      font-size: 12px;
      font-weight: 700;
      color: #203040;
      box-shadow: 0 6px 14px rgba(0,0,0,0.22);
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .photo-callout::after {
      content: "";
      position: absolute;
      left: 18px;
      bottom: -11px;
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 11px solid var(--blue);
    }

    .photo-callout.selected {
      background: #e7f6ff;
      border-color: #219de8;
    }

    @media (max-width: 980px) {
      #app { grid-template-columns: 1fr; grid-template-rows: 48vh 52vh; }
      aside { border-right: 0; border-bottom: 1px solid var(--border); }
      .image-stage { min-height: 210px; }
      .gallery { height: 118px; }
      .thumb { height: 82px; width: 120px; }
    }
  </style>
</head>

<body>
  <div id="app">
    <aside>
      <div class="header">
        <h1 id="projectTitle">Project Photo Map</h1>
        <p>Mapped project photos loaded from <code>data/photos.json</code>.</p>
      </div>

      <div class="viewer">
        <div class="image-stage">
          <img id="mainImage" alt="Selected project photo" />
          <div id="placeholder" class="placeholder">No photo selected. Choose a marker or gallery image to view the larger project photo.</div>
        </div>
        <div id="caption" class="caption">Load photos by adding them to <code>/photos</code> and updating <code>data/photos.json</code>.</div>
      </div>

      <div id="gallery" class="gallery"></div>
    </aside>

    <main id="map"></main>
  </div>

  <div class="map-toolbar">
    <button id="btn-light" onclick="setBasemap('light')">Light</button>
    <button id="btn-aerial" onclick="setBasemap('aerial')" class="active">Aerial + Labels</button>
    <button id="btn-osm" onclick="setBasemap('osm')">OSM</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const MAPBOX_TOKEN = ""; // Optional: paste a Mapbox token here for premium Satellite Streets.

    const map = L.map("map", {
      maxZoom: 23,
      zoomSnap: 0.25,
      zoomDelta: 0.5
    }).setView([52.4862, -1.8904], 7);

    map.createPane("labelsPane");
    map.getPane("labelsPane").style.zIndex = 650;
    map.getPane("labelsPane").style.pointerEvents = "none";

    const basemaps = {
      light: L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
        maxZoom: 23,
        maxNativeZoom: 20,
        attribution: "&copy; OpenStreetMap contributors &copy; CARTO"
      }),

      osm: L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 23,
        maxNativeZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }),

      aerial: MAPBOX_TOKEN
        ? L.tileLayer(`https://api.mapbox.com/styles/v1/mapbox/satellite-streets-v12/tiles/512/{z}/{x}/{y}@2x?access_token=${MAPBOX_TOKEN}`, {
            tileSize: 512,
            zoomOffset: -1,
            maxZoom: 23,
            maxNativeZoom: 22,
            attribution: "Imagery &copy; Mapbox"
          })
        : L.layerGroup([
            L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
              maxZoom: 23,
              maxNativeZoom: 19,
              attribution: "Imagery &copy; Esri"
            }),
            L.tileLayer("https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}", {
              maxZoom: 23,
              maxNativeZoom: 19,
              pane: "labelsPane",
              attribution: "Road labels &copy; Esri"
            }),
            L.tileLayer("https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", {
              maxZoom: 23,
              maxNativeZoom: 19,
              pane: "labelsPane",
              attribution: "Place labels &copy; Esri"
            })
          ])
    };

    let currentBasemap = basemaps.aerial.addTo(map);
    const markers = new Map();
    let photos = [];

    const mainImage = document.getElementById("mainImage");
    const placeholder = document.getElementById("placeholder");
    const caption = document.getElementById("caption");
    const gallery = document.getElementById("gallery");

    function setBasemap(name) {
      if (currentBasemap) map.removeLayer(currentBasemap);
      currentBasemap = basemaps[name].addTo(map);
      document.querySelectorAll(".map-toolbar button").forEach(btn => btn.classList.remove("active"));
      document.getElementById(`btn-${name}`).classList.add("active");
    }

    function makeIcon(photo, selected = false) {
      const label = photo.title || photo.name || "Photo";
      return L.divIcon({
        className: "",
        html: `<div class="photo-callout ${selected ? "selected" : ""}" title="${escapeHtml(label)}">${escapeHtml(label)}</div>`,
        iconSize: [170, 42],
        iconAnchor: [24, 40],
        popupAnchor: [0, -36]
      });
    }

    function selectPhoto(id, zoomTo = false) {
      const photo = photos.find(p => p.id === id);
      if (!photo) return;

      mainImage.src = photo.image;
      mainImage.style.display = "block";
      placeholder.style.display = "none";

      caption.innerHTML = `
        <strong>${escapeHtml(photo.title || photo.name || "Project photo")}</strong>
        ${escapeHtml(photo.caption || "")}
        <br><small>${Number(photo.lat).toFixed(6)}, ${Number(photo.lng).toFixed(6)}</small>
      `;

      document.querySelectorAll(".thumb").forEach(t => t.classList.toggle("active", t.dataset.id === id));

      for (const [markerId, marker] of markers) {
        const markerPhoto = photos.find(p => p.id === markerId);
        marker.setIcon(makeIcon(markerPhoto, markerId === id));
      }

      if (zoomTo) {
        map.setView([photo.lat, photo.lng], Math.max(map.getZoom(), 18), { animate: true });
      }
    }

    function renderPhotos() {
      gallery.innerHTML = "";
      markers.clear();

      const bounds = [];

      photos.forEach((photo, index) => {
        if (!photo.id) photo.id = `photo-${index + 1}`;
        if (!photo.title) photo.title = photo.name || `Photo ${index + 1}`;

        const marker = L.marker([photo.lat, photo.lng], { icon: makeIcon(photo) }).addTo(map);
        marker.on("click", () => selectPhoto(photo.id, false));
        marker.bindPopup(`<strong>${escapeHtml(photo.title)}</strong><br>${escapeHtml(photo.caption || "")}`);
        markers.set(photo.id, marker);

        const thumb = document.createElement("img");
        thumb.className = "thumb";
        thumb.dataset.id = photo.id;
        thumb.src = photo.image;
        thumb.alt = photo.title;
        thumb.onclick = () => selectPhoto(photo.id, true);
        gallery.appendChild(thumb);

        bounds.push([photo.lat, photo.lng]);
      });

      if (bounds.length) {
        map.fitBounds(bounds, { padding: [60, 60], maxZoom: 18 });
        selectPhoto(photos[0].id, false);
      } else {
        caption.textContent = "No photos found. Check data/photos.json and the photos folder.";
      }
    }

    async function loadPhotos() {
      try {
        const response = await fetch("data/photos.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`Could not load photos.json: ${response.status}`);
        const data = await response.json();

        if (data.projectTitle) {
          document.getElementById("projectTitle").textContent = data.projectTitle;
          document.title = data.projectTitle;
        }

        photos = Array.isArray(data) ? data : (data.photos || []);
        renderPhotos();
      } catch (error) {
        caption.innerHTML = `<strong>Could not load project photos.</strong>${escapeHtml(error.message)}<br><br>When testing locally, use a local server rather than opening the file directly.`;
      }
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    loadPhotos();
  </script>
</body>
</html>
